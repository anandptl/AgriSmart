spring.application.name=AgriSmart
#spring.profiles.active=local
server.servlet.session.timeout=15m


spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.port=${PORT:8080}

#Database properties
spring.datasource.url= ${DB_URL}
spring.datasource.username = root
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#image ...
# Multipart file upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB



# Api..
weather.api.key=${WEATHER_KEY}
weather.api.url=${WEATHER_URL}

price.api.key = ${PRICE_KEY}
price.api.url = ${PRICE_URL}


disease.api.key = ${DISEASE_KEY}
disease.api.url= ${DISEASE_URL}
plant.api.url= ${PLANT_URL}

# Secret key for login....
jwt.secret=${JWT_SECRET}


#mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
